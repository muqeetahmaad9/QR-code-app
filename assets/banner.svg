<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR Code Generator &amp; Scanner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05020f"/>
      <stop offset="55%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#2d0a4a"/>
    </linearGradient>

    <pattern id="mot" width="150" height="110" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#f72585" stroke-width="1.2" opacity="0.26">
        <rect x="12" y="14" width="46" height="38" rx="2"/>
        <rect x="86" y="52" width="38" height="44" rx="2"/>
        <rect x="52" y="70" width="26" height="26" rx="2"/>
      </g>
      <g fill="#b14aed" opacity="0.30" font-family="Consolas,monospace" font-size="8">
        <text x="12" y="10">0.94</text><text x="86" y="48">0.88</text>
      </g>
    </pattern>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b14aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#b14aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#b14aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="200" fill="url(#bg)"/>
  <rect width="900" height="200" fill="url(#mot)"/>
  <rect width="900" height="34" fill="url(#scan)" opacity="0.5"/>

  <g fill="none" stroke="#b14aed" stroke-width="2.4" opacity="0.85">
    <path d="M22 52 V22 H52"/><path d="M848 22 H878 V52"/>
    <path d="M22 148 V178 H52"/><path d="M848 178 H878 V148"/>
  </g>

  <text x="60" y="70" font-family="Consolas, 'Courier New', monospace" font-size="14"
        fill="#f72585" opacity="0.78" letter-spacing="2.5">&gt; qr --generate --scan</text>

  <text x="60" y="120" font-family="Consolas, 'Courier New', monospace"
        font-size="38" font-weight="bold" fill="#f72585" filter="url(#glow)"
        letter-spacing="2">QR Code Generator &amp; Scanner</text>

  <text x="62" y="152" font-family="Consolas, 'Courier New', monospace"
        font-size="15" fill="#b14aed" opacity="0.92" letter-spacing="1.2">Generate and decode QR codes in Python or Colab</text>

  <rect x="60" y="164" width="150" height="2.5" fill="#f72585" opacity="0.85"/>
</svg>
